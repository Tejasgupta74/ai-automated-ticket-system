name: Azure App Service Deployment (OIDC)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Azure Environment (staging / production)"
        required: true
        default: "production"

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: "cerevyn-ps04-ticket-service"
  CONTAINER_REGISTRY: "cerevynacr.azurecr.io"
  IMAGE_NAME: "ticket-automation"

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Azure App Service
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log into Azure using passwordless OIDC federation
      - name: 'Azure Login via OIDC Federated Credentials'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Log in to Azure Container Registry (ACR)'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 'Build and Push Container Image'
        run: |
          docker build -t ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: 'Deploy to Azure Web App for Containers'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
